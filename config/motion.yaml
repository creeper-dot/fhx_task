# 导航行为调度
bt_navigator:
  ros__parameters:
    global_frame: world
    robot_base_frame: base_link
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

# 全局地图 + 全局规划
planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      # SmacPlanner2D：无运动学约束的 2D A*
      plugin: "nav2_smac_planner::SmacPlanner2D"
      # 到目标容差（米），内部按地图分辨率换算成格数；0.1 分辨率下 ≈ 1 格
      tolerance: 0.1
      # 是否允许穿越未知栅格（跨场导航必须为 true）
      allow_unknown: true
      # 搜索迭代上限，一般不动
      max_iterations: 1000000
      # 终点附近的额外迭代次数，一般不动
      max_on_approach_iterations: 1000
      # 单次规划时间预算（秒），也决定留给平滑的时间；大图可适当调大，过大会加剧卡顿
      max_planning_time: 2.0
      # 代价图惩罚系数：越大越贴走廊中线/远离障碍，越小越抄近路
      cost_travel_multiplier: 5.0
      # 末位姿是否取"接近方向"的朝向；跟踪器不转向，保持 false
      use_final_approach_orientation: false
      # 路径后处理平滑（SimpleSmoother）
      smoother:
        max_iterations: 1000
        # 平滑权重：越大路径越直顺
        w_smooth: 0.3
        # 贴合原搜索路径/障碍的权重：越大越贴障碍
        w_data: 0.3
        tolerance: 1.0e-10
        # 是否平滑后再细化
        do_refinement: true
        refinement_num: 2

global_costmap:
  global_costmap:
    ros__parameters:
      initial_transform_timeout: 120.0
      global_frame: world
      robot_base_frame: base_link
      # 车体轮廓（正方形半边 0.2475，对应对角 0.7）；2D 规划按内接半径判碰
      footprint: "[[0.35, 0.0], [0.247, 0.247], [0.0, 0.35], [-0.247, 0.247], [-0.35, 0.0], [-0.247, -0.247], [0.0, -0.35], [0.247, -0.247]]"
      # 代价图刷新/发布频率（Hz），想更跟手可调到 10
      update_frequency: 5.0
      publish_frequency: 5.0
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]

      static_layer:

        plugin: "nav2_costmap_2d::StaticLayer"
        # 全局地图来源
        map_topic: "/map"
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 障碍膨胀半径（米）：决定离墙余量，不得小于内接半径 0.2475
        inflation_radius: 0.7
        # 膨胀代价衰减缓急：越大越贴墙，越小越走中间
        cost_scaling_factor: 0.3

# 局部地图 + 局部规划
controller_server:
  ros__parameters:
    global_frame: world
    # 控制输出频率（Hz）
    controller_frequency: 20.0

    # 进度检查，超时没有移动会导向导航事件失败
    progress_checker_plugin: "progress_checker"
    current_progress_checker: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 判定"有进展"的位移阈值（米）
      required_movement_radius: 0.08
      # 多久没动就 abort 触发恢复（秒）
      movement_time_allowance: 4.0

    # 目标检查，一般不检查旋转角
    goal_checker_plugins: ["general_goal_checker"]
    current_goal_checker: "general_goal_checker"
    general_goal_checker:
      plugin: "nav2_controller::PositionGoalChecker"
      # 到点判定半径（米）
      xy_goal_tolerance: 0.1

    # 布局规划核心
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # 运动模型：全向底盘，各轴独立、无前进方向偏好
      motion_model: "Omni"
      # 预测时域的离散步数，总预测时长 = time_steps * model_dt = 2.5s；越大越有远见但越慢
      time_steps: 50
      # 每步积分时长（秒），即控制周期 0.05s（20Hz）
      model_dt: 0.05
      # 每个周期采样的轨迹条数，越大探索越充分但计算量越大
      batch_size: 1400
      # 每个周期的优化迭代次数，通常 1 次即可
      iteration_count: 1
      # 轨迹剪枝距离（米）：只保留前方该距离内的轨迹参与代价计算
      prune_distance: 6.0
      # 坐标变换容差（秒），查 TF 的超时裕量
      transform_tolerance: 0.1
      # 每个周期重新生成采样噪声（而非复用），保证持续探索
      regenerate_noises: true
      # 优化无解时的重试次数，避免偶然数值问题直接失败
      retry_attempt_limit: 6
      # 是否发布可视化（轨迹/评价器等），调试用
      visualize: true

      # 速度与加速度限制
      vx_max: +2.0
      vx_min: -2.0
      vy_max: +2.0
      vy_min: -2.0
      # 旋转速度上限（rad/s）：全向底盘不靠旋转运动，取极小值（不可为 0，否则数值奇异）
      wz_max: +0.001
      ax_max: +20.0
      ax_min: -20.0
      ay_max: +20.0
      ay_min: -20.0
      # 角加速度上限，同上取极小值
      az_max: +0.001

      # 采样噪声，鼓励左右探索
      # vx/vy 采样噪声标准差：必须对称，保持各向同性，不制造某个方向偏好
      vx_std: 0.55
      vy_std: 0.55
      # 旋转采样噪声：极小但不为 0，仅避免全零导致数值奇异
      wz_std: 0.001
      # 软最优化温度：越低越贪心（选最优轨迹），越高越平均/越探索
      temperature: 0.34
      # 代价折扣因子，未来代价的衰减速度
      gamma: 0.015

      # 评价器集合，总代价为各项加权和
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "PathAlignCritic",
          "PathFollowCritic",
        ]
      # 约束评价器：惩罚超出速度/加速度限制的轨迹
      ConstraintCritic:
        enabled: true
        cost_weight: 5.0
      # 代价评价器：碰撞与贴近障碍的惩罚
      CostCritic:
        enabled: true
        cost_weight: 10.0
        # 到达该代价即视为危险，触发高惩罚
        critical_cost: 120.0
        # 碰撞的代价值（极大，等价硬约束）
        collision_cost: 8000000.0
        # 近碰撞代价值；必须是整数，写成浮点会导致 controller_server 无法 activate
        near_collision_cost: 230
        # 代价随距离的幂次，越大越强调远离障碍
        cost_power: 2
        # 用实际 footprint 而非质点做碰撞检查，安全边界与车体一致
        consider_footprint: true
        # 距目标该距离内改用目标代价，弱化避障以完成最后接近
        near_goal_distance: 0.3
        # 轨迹采样步长，越小检查越密但越慢
        trajectory_point_step: 1
      # 目标评价器：吸引轨迹接近目标点
      GoalCritic:
        enabled: true
        cost_weight: 5.0
        # 距目标小于该距离才开始计分，避免全程被目标牵引
        threshold_to_consider: 1.0
      # 路径对齐评价器：让轨迹方向贴合全局路径
      PathAlignCritic:
        enabled: true
        cost_weight: 0.8
        # 距路径小于该距离才开始计分
        threshold_to_consider: 1.0
        # 轨迹采样步长，控制对齐检查的密度
        trajectory_point_step: 3
      # 路径跟随评价器：鼓励沿全局路径向前推进
      PathFollowCritic:
        enabled: true
        cost_weight: 3.2
        # 距路径小于该距离才开始计分
        threshold_to_consider: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      initial_transform_timeout: 120.0
      global_frame: base_link
      robot_base_frame: base_link
      footprint: "[[0.35, 0.0], [0.247, 0.247], [0.0, 0.35], [-0.247, 0.247], [-0.35, 0.0], [-0.247, -0.247], [0.0, -0.35], [0.247, -0.247]]"
      update_frequency: 10.0
      publish_frequency: 10.0
      always_send_full_costmap: true
      rolling_window: true
      width: 16
      height: 16
      resolution: 0.04
      transform_tolerance: 0.1
      track_unknown_space: false
      plugins: [static_layer, inflation_layer]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /local_map
        map_subscribe_transient_local: false
        subscribe_to_updates: true
        use_maximum: true
        track_unknown_space: false
        lethal_cost_threshold: 90

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
        cost_scaling_factor: 0.5
